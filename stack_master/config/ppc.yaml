pp:
  ros__parameters:
    control_rate_hz:  50.0
    estop_min_dist:   0.5     # [m]
    estop_angle_deg: 30.0     # [deg]
    pp_wheelbase:     0.33    # [m]
    pp_max_steer:     0.4     # [rad]

    # ── Adaptive L1 lookahead ──────────────────────────────────────────
    # L = clip(lookahead_k * v,  [max(pp_lookahead, √2·|lateral_err|),  pp_t_clip_max])
    pp_lookahead:    0.8      # [m]   absolute minimum lookahead
    pp_t_clip_max:   3.0      # [m]   absolute maximum lookahead
    lookahead_k:     0.45      # [s]   speed coefficient

    # ── Speed ─────────────────────────────────────────────────────────
    speed_lookahead: 0.5      # [s]   time horizon for target speed lookup
    lat_speed_gain:  0.0      # [≥0]  deceleration gain per [m] lateral error (0=off)
    delta_speed_gain: 0.0     # [≥0]  deceleration gain per [rad] steering angle (0=off)

    # ── Steering ──────────────────────────────────────────────────────
    steer_spd_start: 3.0      # [m/s] speed where steer downscaling starts
    steer_spd_end:   6.0      # [m/s] speed where downscaling saturates
    steer_downscale: 0.0      # [0–1] steer fraction removed at steer_spd_end
    steer_rate_limit: 10.0    # [rad] max |Δsteer| per control step

    # ── Heading-error PID correction ──────────────────────────────────
    # heading_err = angle between heading and the bearing to the lookahead point.
    # PID output is ADDED to the PP steer.  All gains 0 → plain pure pursuit.
    heading_kp:    0.5        # [-]    proportional gain
    heading_ki:    0.0        # [1/s]  integral gain
    heading_kd:    0.05        # [s]    derivative gain
    heading_i_max: 0.3        # [rad]  anti-windup clamp on I term

# ──────────────────────────────────────────────────────────────────────────────
# trailing node  (controller/trailing_node.py)
# Controls opponent detection, Kalman tracking, and PD speed following.
# Set trailing_enabled: false to skip all trailing logic (PP commands passed through).
# ──────────────────────────────────────────────────────────────────────────────
trailing:
  ros__parameters:
    trailing_enabled: true        # true = active; false = pass PP commands through unchanged

    # ── Path-corridor filter ──────────────────────────────────────────
    # Trailing is only triggered when the Kalman-estimated opponent position
    # is within corridor_width/2 of the global waypoints ahead of the ego.
    # Opponent on a different part of the track → no trailing.
    corridor_width:       0.8    # [m]   lateral band around the planned path

    # ── Clustering (Adaptive Breakpoint Detector) ─────────────────────
    lambda_deg:          15.0    # [deg] max admissible incidence angle
    cluster_sigma:        0.5    # [m]   range-noise term #0.3
    min_cluster_points:    10    # drop clusters with fewer points than this

    # ── L-shape fitting ───────────────────────────────────────────────
    max_obs_size:         0.4    # [m]   reject fitted boxes larger than this #0.7
    n_angles:              90    # orientation search resolution over [0°, 90°)

    # ── Kalman tracking ───────────────────────────────────────────────
    opp_max_lat:          0.5    # [m]   ignore obstacles farther sideways than this
    max_misses:            10    # drop the track after this many consecutive missed frames
    kalman_q:             0.5    # process-noise scale (larger = follow measurements less)
    kalman_r:           2.0    # measurement-noise scale (larger = trust LiDAR less)
    lidar_to_base_x:     0.27    # [m]   base_link → laser TF offset (x)

    # ── Trailing PD speed control ─────────────────────────────────────
    desired_gap:          2.5    # [m]   gap to hold behind the opponent
    detect_range:         8.0    # [m]   start trailing reactions within this distance
    trailing_kp:          1.0    # P gain on the gap error (opp_dist - desired_gap) #5.0
    trailing_kd:          0.4    # D gain on the closing speed (d gap / dt) #2.0
    trailing_max_speed:   2.0    # [m/s] absolute speed cap during trailing

    # ── Release ramp (trailing → free) ───────────────────────────────
    # When trailing ends (opponent lost / off-path), the commanded speed is
    # clamped to  min(pp_speed, ego_v + trailing_release_clip)  each step.
    # This prevents a sudden jump to the global-waypoint speed.
    # Ramp ends automatically once pp_speed ≤ ego_v + trailing_release_clip.
    trailing_release_clip: 0.5   # [m/s] max speed step above current ego_v

    # ── Map-based static scan filter ─────────────────────────────────
    # Before clustering, LiDAR points whose map-frame position falls on a
    # known occupied cell are removed.  This prevents track protrusions /
    # walls from being clustered and misidentified as opponent cars.
    use_map_filter:      true   # set false to disable (e.g. during mapping)
    map_name:            final  # must match the 'map' argument in ppc.launch.xml
    map_inflation_cells: 10      # inflate occupied mask by N cells (1 cell = 5 cm) #9
